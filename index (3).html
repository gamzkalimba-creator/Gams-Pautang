<!DOCTYPE html>
<html lang="ceb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pautang Tracker</title>
<meta name="theme-color" content="#1f6b45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pautang">
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1d2a22; --muted:#6b756e; --line:#e4ded2;
  --green:#1f6b45; --green2:#e3f1e8; --red:#b4362b; --red2:#fbe6e3; --amber:#a86a0c; --amber2:#fcf0d8;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 14px 96px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 14px}
header h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.02em}
header h1 span{color:var(--green)}
.status{font-size:12px;color:var(--muted);text-align:right}
.status.err{color:var(--red)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat.big{grid-column:1/-1;background:var(--green);color:#fff;border:none}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.stat.big .l{color:#cfe8da}
.stat .v{font-size:20px;font-weight:800;margin-top:2px;letter-spacing:-.01em}
.stat.big .v{font-size:28px}
.stat .s{font-size:12px;color:#cfe8da;margin-top:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}
.tab{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:10px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;text-align:left;width:100%}
.item:active{transform:scale(.99)}
.item .n{font-weight:700;font-size:15px}
.item .m{font-size:12px;color:var(--muted);margin-top:3px}
.item .r{text-align:right;flex-shrink:0}
.item .b{font-weight:800;font-size:15px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;margin-top:4px}
.pill.ok{background:var(--green2);color:var(--green)}
.pill.late{background:var(--red2);color:var(--red)}
.pill.soon{background:var(--amber2);color:var(--amber)}
.pill.done{background:#ecebe6;color:var(--muted)}
.bar{height:6px;background:#ece7dc;border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.empty{text-align:center;color:var(--muted);padding:36px 16px;background:var(--card);border:1px dashed var(--line);border-radius:var(--radius)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom));background:var(--green);color:#fff;border:none;border-radius:999px;padding:14px 22px;font-weight:700;font-size:15px;box-shadow:0 8px 24px rgba(31,107,69,.35);cursor:pointer;z-index:5}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.back{background:none;border:none;color:var(--green);font-weight:700;padding:6px 0;margin-bottom:6px;cursor:pointer;font-size:15px}
h2{font-size:22px;margin:0 0 2px;font-weight:800;letter-spacing:-.02em}
h3{font-size:14px;margin:0 0 10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:14px}
.kv .k{color:var(--muted)}
.kv .v{font-weight:700;text-align:right}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;font-size:14px}
.btn.pri{background:var(--green);color:#fff;border-color:var(--green)}
.btn.dan{color:var(--red);border-color:#efc9c4}
.btn.full{width:100%}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:16px}
textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.calc{background:var(--green2);border-radius:12px;padding:12px;margin-top:14px;font-size:14px}
.calc b{color:var(--green)}
.pay{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.pay:first-child{border-top:none}
.pay .x{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px}
.sched{font-size:13px}
.sched div{display:flex;justify-content:space-between;padding:6px 0;border-top:1px dashed var(--line)}
.sched div:first-child{border-top:none}
.sched .paid{color:var(--green)}
.sched .late{color:var(--red);font-weight:700}
.modal{position:fixed;inset:0;background:rgba(20,28,22,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px max(18px,env(safe-area-inset-bottom))}
.msg{white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:14px}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.banner{background:var(--amber2);color:var(--amber);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
.av{width:44px;height:44px;border-radius:50%;object-fit:cover;flex-shrink:0;background:#e9e3d6;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted);font-size:17px}
.photo{width:96px;height:96px;border-radius:18px;object-fit:cover;cursor:pointer;border:1px solid var(--line);flex-shrink:0}
.ph-edit{display:flex;gap:12px;align-items:center;margin-top:4px}
.ph-edit .prev{width:84px;height:84px;border-radius:16px;object-fit:cover;background:#efe9de;display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;border:1px dashed var(--line)}
.ph-btns{display:flex;flex-direction:column;gap:6px;flex:1}
.ph-btns label.btn{margin:0;color:var(--ink);text-align:center;font-size:14px}
.ph-btns label.btn{position:relative;overflow:hidden}
.ph-btns input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px;padding:0;margin:0;border:0}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;z-index:25;padding:16px}
.viewer img{max-width:100%;max-height:100%;border-radius:12px}
.agree{font-family:Georgia,'Times New Roman',serif;font-size:15px;line-height:1.55}
.agree p{margin:0 0 10px}
.atitle{font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-weight:800;text-align:center;letter-spacing:.04em;margin-bottom:12px;font-size:16px}
.asign{display:flex;gap:14px;align-items:flex-end;margin-top:12px;font-family:system-ui,sans-serif}
#sigpad{width:100%;height:160px;background:#fff;border:1px dashed #c9c1b1;border-radius:12px;touch-action:none;display:block}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:999px;font-size:13px;z-index:30}
</style>
</head>
<body>
<div id="app"></div>
<script type="application/json" id="seed">{"loans":[]}</script>
<script>
(function(){
"use strict";
var STATE={loans:[]};
var pendingPhoto, uploading=false, installEvt=null;
var saveStatus='', filter='active', query='', modal=null;
var app=document.getElementById('app');

var FREQ={daily:'Adlaw-adlaw',weekly:'Kada semana',kinsenas:'Kada 15 adlaw',monthly:'Kada bulan',once:'Usa ra ka bayad'};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function peso(n){n=Math.round((+n||0)*100)/100;return '₱'+n.toLocaleString('en-PH',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});}
function today(){var d=new Date();return iso(d);}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parse(s){var p=String(s).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function fmtDate(s){if(!s)return '';var d=parse(s);return d.toLocaleDateString('en-PH',{month:'short',day:'numeric',year:'numeric'});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function addPeriod(start,freq,k){var d=parse(start);
  if(freq==='daily')d.setDate(d.getDate()+k);
  else if(freq==='weekly')d.setDate(d.getDate()+7*k);
  else if(freq==='kinsenas')d.setDate(d.getDate()+15*k);
  else { var day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+k); var last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); }
  return iso(d);}

function calc(l){
  var P=+l.principal||0, r=(+l.rate||0)/100, months=Math.max(1,+l.months||1);
  var interest = l.rateType==='flat' ? P*r : P*r*months;
  var total=P+interest;
  var terms = l.freq==='once'?1:Math.max(1,+l.terms||1);
  var inst=total/terms;
  var paid=(l.payments||[]).reduce(function(a,p){return a+(+p.amt||0);},0);
  var bal=Math.max(0,Math.round((total-paid)*100)/100);
  var sched=[];
  for(var i=1;i<=terms;i++){
    var due = l.freq==='once' ? addPeriod(l.start,'monthly',months) : addPeriod(l.start,l.freq,i);
    sched.push({n:i,due:due,amt:inst,cum:inst*i});
  }
  var t=today(), dueNow=0, nextDue=null, lateFrom=null;
  sched.forEach(function(s){ if(s.due<=t) dueNow=s.cum; if(!nextDue && paid+0.009<s.cum) nextDue=s; });
  var behind=Math.max(0,Math.round((dueNow-paid)*100)/100);
  var status;
  if(bal<=0.009) status='done';
  else if(behind>0.009) status='late';
  else if(nextDue && daysBetween(t,nextDue.due)<=3) status='soon';
  else status='ok';
  return {P:P,interest:interest,total:total,terms:terms,inst:inst,paid:paid,bal:bal,sched:sched,behind:behind,nextDue:nextDue,status:status};
}
function photoSrc(ref){ return (ref && ref.indexOf('data:')===0) ? ref : ''; }
function avatar(l,cls){ return photoSrc(l.photo) ? '<img class="'+(cls||'av')+'" src="'+esc(photoSrc(l.photo))+'" alt="">' : '<div class="av">'+esc((l.name||'?').trim().charAt(0).toUpperCase())+'</div>'; }
function shrink(file,max,q){ return new Promise(function(res,rej){ var u=URL.createObjectURL(file), im=new Image();
  im.onload=function(){ var w=im.width,h=im.height,k=Math.min(1,max/Math.max(w,h)); var c=document.createElement('canvas'); c.width=Math.round(w*k); c.height=Math.round(h*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(function(b){ b?res({blob:b,canvas:c}):rej(); },'image/jpeg',q); };
  im.onerror=function(){URL.revokeObjectURL(u);rej();}; im.src=u; }); }
function handlePhoto(file){
  if(!file) return; uploading=true; setPrev(null,'⏳');
  var done=function(ref){ uploading=false; pendingPhoto=ref; setPrev(ref); };
  var fail=function(){ uploading=false; setPrev(currentPrev()); toast('Dili ma-save ang picture'); };
  shrink(file,640,0.72).then(function(r){ done(r.canvas.toDataURL('image/jpeg',0.72)); }).catch(fail);
}
function currentPrev(){ if(pendingPhoto!==undefined) return pendingPhoto; var r=route(); var l=r.indexOf('edit-')===0?findLoan(r.slice(5)):null; return l?l.photo:null; }
function setPrev(ref,txt){ var el=document.getElementById('prev'); if(!el) return;
  el.innerHTML = ref ? '<img src="'+esc(photoSrc(ref))+'" style="width:100%;height:100%;object-fit:cover;border-radius:16px">' : (txt||'📷');
  var rm=document.getElementById('phrm'); if(rm) rm.style.display=ref?'':'none'; }
function daysBetween(a,b){return Math.round((parse(b)-parse(a))/86400000);}
var STATUS={ok:['ok','Maayo'],late:['late','Nalangan'],soon:['soon','Duol na ang bayad'],done:['done','Bayad na']};
function pill(st){return '<span class="pill '+STATUS[st][0]+'">'+STATUS[st][1]+'</span>';}

/* ---------- saving (sa phone) ---------- */
var dbp=null;
function idb(){ if(dbp) return dbp; dbp=new Promise(function(res,rej){ try{ var r=indexedDB.open('pautang',1);
  r.onupgradeneeded=function(){ r.result.createObjectStore('kv'); }; r.onsuccess=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; }catch(e){ rej(e); } }); return dbp; }
function kvGet(k){ return idb().then(function(db){ return new Promise(function(res,rej){ var q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=function(){res(q.result);}; q.onerror=function(){rej(q.error);}; }); }); }
function kvPut(k,v){ return idb().then(function(db){ return new Promise(function(res,rej){ var t=db.transaction('kv','readwrite'); t.objectStore('kv').put(v,k); t.oncomplete=function(){res();}; t.onerror=function(){rej(t.error);}; t.onabort=function(){rej(t.error);}; }); }); }
var saveTimer=null;
function save(){ clearTimeout(saveTimer); saveTimer=setTimeout(doSave,150); }
function doSave(){
  saveStatus='saving'; renderStatus();
  var json=JSON.stringify(STATE);
  kvPut('state',json).then(function(){ saveStatus='saved'; renderStatus(); }).catch(function(){
    try{ localStorage.setItem('pautang_state',json); saveStatus='saved'; }catch(e){ saveStatus='error'; }
    renderStatus(); });
}
function statusText(){ return {saving:'Nag-save…',saved:'✓ Na-save sa phone',error:'Wala na-save! Puno ang storage?'}[saveStatus]||''; }
function renderStatus(){var el=document.getElementById('st'); if(el){el.textContent=statusText(); el.className='status'+(saveStatus==='error'?' err':'');}}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove();},1800);}

/* ---------- routing ---------- */
function route(){ var h=location.hash.replace('#',''); return h||'home'; }
function go(h){ if(location.hash==='#'+h) render(); else location.hash=h; window.scrollTo(0,0); }
window.addEventListener('hashchange',function(){modal=null;pendingPhoto=undefined;signPhoto=null;render();});
function findLoan(id){for(var i=0;i<STATE.loans.length;i++) if(STATE.loans[i].id===id) return STATE.loans[i]; return null;}

/* ---------- views ---------- */
function render(){
  var r=route(), html;
  if(r==='add') html=viewForm(null);
  else if(r.indexOf('edit-')===0) html=viewForm(findLoan(r.slice(5)));
  else if(r.indexOf('loan-')===0){ var l=findLoan(r.slice(5)); html=l?viewLoan(l):viewHome(); }
  else if(r==='backup') html=viewBackup();
  else if(r.indexOf('agree-')===0){ var la=findLoan(r.slice(6)); html=la?viewAgree(la):viewHome(); }
  else html=viewHome();
  app.innerHTML='<div class="wrap">'+html+'</div>'+(modal?modal():'');
  renderStatus(); bind();
}
function headerBar(){return '<header><h1>Pautang<span>.</span></h1><div class="status" id="st"></div></header>';}

function viewHome(){
  var tot={lent:0,coll:0,bal:0,int:0,late:0,lateAmt:0,active:0};
  var rows=STATE.loans.map(function(l){var c=calc(l);
    tot.lent+=c.P; tot.coll+=c.paid; tot.bal+=c.bal; tot.int+=c.interest;
    if(c.status==='late'){tot.late++;tot.lateAmt+=c.behind;}
    if(c.status!=='done')tot.active++;
    return {l:l,c:c};});
  var counts={all:rows.length,active:0,late:0,done:0};
  rows.forEach(function(x){ if(x.c.status!=='done')counts.active++; if(x.c.status==='late')counts.late++; if(x.c.status==='done')counts.done++; });
  var q=query.toLowerCase();
  var shown=rows.filter(function(x){
    if(filter==='active'&&x.c.status==='done')return false;
    if(filter==='late'&&x.c.status!=='late')return false;
    if(filter==='done'&&x.c.status!=='done')return false;
    return !q||(x.l.name+' '+(x.l.phone||'')).toLowerCase().indexOf(q)>=0;
  });
  var order={late:0,soon:1,ok:2,done:3};
  shown.sort(function(a,b){ if(order[a.c.status]!==order[b.c.status]) return order[a.c.status]-order[b.c.status];
    var ad=a.c.nextDue?a.c.nextDue.due:'9', bd=b.c.nextDue?b.c.nextDue.due:'9'; return ad<bd?-1:ad>bd?1:0; });
  var h=headerBar();
  if(installEvt) h+='<div class="banner" style="display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--green2);color:var(--green)"><span>I-install ang app sa imong phone aron mogana offline.</span><button class="btn pri" data-act="install">I-install</button></div>';
  var lb=STATE.lastBackup, dd=lb?daysBetween(lb,today()):999;
  if(STATE.loans.length && dd>=7) h+='<div class="banner" style="display:flex;justify-content:space-between;align-items:center;gap:10px"><span>'+(lb?dd+' ka adlaw na sukad sa imong backup.':'Wala pa kay backup.')+' Sa phone ra ang data — mag-backup aron dili mawala.</span><button class="btn" data-go="backup">Backup</button></div>';

  h+='<div class="stats">'+
    '<div class="stat big"><div class="l">Nabilin pa nga makolekta</div><div class="v">'+peso(tot.bal)+'</div><div class="s">'+tot.active+' ka aktibo nga utang</div></div>'+
    '<div class="stat"><div class="l">Gipautang (puhunan)</div><div class="v">'+peso(tot.lent)+'</div></div>'+
    '<div class="stat"><div class="l">Nakolekta na</div><div class="v">'+peso(tot.coll)+'</div></div>'+
    '<div class="stat"><div class="l">Ganansya (interes)</div><div class="v">'+peso(tot.int)+'</div></div>'+
    '<div class="stat"><div class="l">Nalangan</div><div class="v" style="color:'+(tot.late?'var(--red)':'inherit')+'">'+tot.late+(tot.late?' · '+peso(tot.lateAmt):'')+'</div></div>'+
  '</div>';
  h+='<div class="tabs">'+[['active','Aktibo'],['late','Nalangan'],['done','Bayad na'],['all','Tanan']].map(function(t){
    return '<button class="tab'+(filter===t[0]?' on':'')+'" data-f="'+t[0]+'">'+t[1]+' ('+counts[t[0]]+')</button>';}).join('')+'</div>';
  if(STATE.loans.length) h+='<input class="search" id="q" placeholder="Pangitaa ang ngalan…" value="'+esc(query)+'">';
  if(!STATE.loans.length) h+='<div class="empty"><div style="font-size:34px">💵</div><b>Wala pay utang nga na-record</b><div style="margin-top:6px">Pindota ang <b>+ Bag-ong Utang</b> sa ubos aron magsugod.</div></div>';
  else if(!shown.length) h+='<div class="empty">Walay makita dinhi.</div>';
  else h+='<div class="list">'+shown.map(function(x){var l=x.l,c=x.c,pct=c.total?Math.min(100,c.paid/c.total*100):0;
    var sub = c.status==='done' ? 'Nahuman · '+peso(c.total) :
      (c.status==='late' ? 'Kulang '+peso(c.behind) : (c.nextDue?'Sunod: '+peso(Math.min(c.inst,c.bal))+' sa '+fmtDate(c.nextDue.due):''));
    return '<button class="item" data-go="loan-'+l.id+'" style="align-items:center">'+avatar(l)+'<div style="flex:1;min-width:0"><div class="n">'+esc(l.name)+'</div><div class="m">'+sub+'</div><div class="bar"><i style="width:'+pct.toFixed(1)+'%"></i></div></div>'+
      '<div class="r"><div class="b">'+peso(c.bal)+'</div>'+pill(c.status)+'</div></button>';}).join('')+'</div>';
  h+='<div style="text-align:center;margin-top:18px"><button class="btn" data-go="backup">Backup / Restore</button></div>';
  h+='<button class="fab" data-go="add">+ Bag-ong Utang</button>';
  return h;
}

function viewLoan(l){
  var c=calc(l);
  var h='<button class="back" data-go="home">‹ Balik</button>';
  h+='<div style="display:flex;align-items:center;gap:14px;margin-bottom:12px">'+(photoSrc(l.photo)?'<img class="photo" data-view="1" src="'+esc(photoSrc(l.photo))+'" alt="">':'<div class="av" style="width:72px;height:72px;font-size:28px">'+esc((l.name||'?').trim().charAt(0).toUpperCase())+'</div>')+'<div style="flex:1;min-width:0"><h2>'+esc(l.name)+'</h2>'+
    (l.phone?'<div class="note" style="margin-top:2px">📞 '+esc(l.phone)+'</div>':'')+pill(c.status)+'</div></div>';
  h+='<div class="stats"><div class="stat big"><div class="l">Nabilin</div><div class="v">'+peso(c.bal)+'</div><div class="s">Nabayran: '+peso(c.paid)+' sa '+peso(c.total)+'</div></div></div>';

function backupName(){ return 'pautang-backup-'+today()+'.json'; }

function shareBackup(){

  var file=null; try{ file=new File([json],name,{type:'application/json'}); }catch(e){}
  if(file && navigator.canShare && navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Pautang backup'}).then(function(){ markBackup(); toast('Na-send ang backup'); render(); }).catch(function(e){ if(!e||e.name!=='AbortError') downloadBackup(json,name); });

function downloadBackup(json,name){

  markBackup(); toast('Na-download: '+name); render();
}

function setupPad(cv){
  var r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1, ctx=cv.getContext('2d');
  cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); ctx.scale(dpr,dpr);
  ctx.lineWidth=2.6; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#1d2a22'; padDirty=false;
  var on=false; function pos(e){ var b=cv.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top]; }
  cv.onpointerdown=function(e){ on=true; try{cv.setPointerCapture(e.pointerId);}catch(_){} var p=pos(e); ctx.beginPath(); ctx.moveTo(p[0],p[1]); ctx.lineTo(p[0]+.1,p[1]+.1); ctx.stroke(); padDirty=true; e.preventDefault(); };
  cv.onpointermove=function(e){ if(!on) return; var p=pos(e); ctx.lineTo(p[0],p[1]); ctx.stroke(); e.preventDefault(); };
  cv.onpointerup=cv.onpointercancel=function(){ on=false; };
}

    ctx.font='32px '+F; var lines=[];
    a.text.forEach(function(p){ var words=p.split(' '), cur=''; words.forEach(function(w){ var t=cur?cur+' '+w:w; if(ctx.measureText(t).width>W-2*P&&cur){ lines.push(cur); cur=w; } else cur=t; }); lines.push(cur); lines.push(''); });

    ctx.fillStyle='#fffdf8'; ctx.fillRect(0,0,W,H); ctx.fillStyle='#1f6b45'; ctx.fillRect(0,0,W,14);
    ctx.fillStyle='#1d2a22'; ctx.font='800 50px '+F; ctx.textAlign='center'; ctx.fillText('KASABUTAN SA PAUTANG',W/2,P+50);

      ctx.fillStyle='#6b756e'; ctx.font='26px '+F; ctx.fillText('Picture sa pag-uyon',P,y+340); }
    if(ims[1]){ var x0=P+340, bw=W-P-x0, bh=220, k2=Math.min(bw/ims[1].width,bh/ims[1].height); ctx.drawImage(ims[1],x0,y+40,ims[1].width*k2,ims[1].height*k2);
      ctx.strokeStyle='#1d2a22'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x0,y+270); ctx.lineTo(W-P,y+270); ctx.stroke();
      ctx.fillStyle='#6b756e'; ctx.font='26px '+F; ctx.fillText('Pirma ni '+l.name,x0,y+310); }
    ctx.fillStyle='#1d2a22'; ctx.font='600 28px '+F; ctx.fillText('Miuyon ug gipirmahan: '+fmtDT(a.at),P,H-60);
    cv.toBlob(function(b){ var name='kasabutan-'+l.name.replace(/[^a-z0-9]+/gi,'-')+'.png', file=null;
      try{ file=new File([b],name,{type:'image/png'}); }catch(e){}

      else { var el=document.createElement('a'); el.href=URL.createObjectURL(b); el.download=name; document.body.appendChild(el); el.click(); setTimeout(function(){el.remove();},2000); toast('Na-download ang kasabutan'); }
    },'image/png');
  });
}

function copy(t){ try{ navigator.clipboard.writeText(t).then(function(){toast('Nakopya!');},function(){toast('Dili makopya — i-select ug kopyaha');}); }catch(e){ toast('Dili makopya — i-select ug kopyaha'); } }
function bind(){
  app.querySelectorAll('[data-go]').forEach(function(b){b.onclick=function(){go(b.getAttribute('data-go'));};});
  app.querySelectorAll('[data-f]').forEach(function(b){b.onclick=function(){filter=b.getAttribute('data-f');render();};});
  var q=document.getElementById('q'); if(q){ q.oninput=function(){query=q.value;var pos=q.selectionStart;render();var n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos);}; }
  app.querySelectorAll('[data-close]').forEach(function(b){b.onclick=function(ev){ if(ev.target===b) closeModal(); };});
  var r=route(), l=r.indexOf('loan-')===0?findLoan(r.slice(5)):null;
  app.querySelectorAll('[data-act]').forEach(function(b){b.onclick=function(){
    var a=b.getAttribute('data-act');
    if(a==='pay') openModal(payModal(l));
    else if(a==='remind') openModal(remindModal(l));
    else if(a==='copyrm') copy(remindText(l));
    else if(a==='del') openModal(confirmModal('Mapapas ang utang ni <b>'+esc(l.name)+'</b> ug tanan niyang bayad. Dili na kini mabalik.',function(){
        STATE.loans=STATE.loans.filter(function(x){return x.id!==l.id;}); modal=null; save(); go('home'); toast('Napapas'); }));
    else if(a==='yes'){ if(window.__yes) window.__yes(); }
    else if(a==='copybk'){ copy(JSON.stringify(STATE)); markBackup(); }
    else if(a==='sharebk') shareBackup();
    else if(a==='restore') tryRestore(document.getElementById('rs').value);
    else if(a==='install' && installEvt){ installEvt.prompt(); installEvt.userChoice.finally(function(){ installEvt=null; render(); }); }
  };});
  app.querySelectorAll('[data-view]').forEach(function(im){ im.onclick=function(){ openModal(function(){ return '<div class="viewer" data-close="1"><img src="'+esc(photoSrc(l.photo))+'" alt=""></div>'; }); }; });
  var rf=document.getElementById('rsfile'); if(rf) rf.onchange=function(){ var f=rf.files&&rf.files[0]; if(!f) return; var rd=new FileReader(); rd.onload=function(){ tryRestore(String(rd.result)); }; rd.readAsText(f); rf.value=''; };
  app.querySelectorAll('[data-delpay]').forEach(function(b){b.onclick=function(){ var pid=b.getAttribute('data-delpay');
    openModal(confirmModal('Mapapas kining bayad.',function(){ l.payments=l.payments.filter(function(p){return p.id!==pid;}); modal=null; save(); render(); }));};});
  var lf=document.getElementById('lf');
  if(lf){
    var upd=function(){ var f=formData(lf); document.getElementById('mwrap').style.display=f.rateType==='monthly'||f.freq==='once'?'':'none';
      document.getElementById('twrap').style.display=f.freq==='once'?'none':'';
      var c=calc(f); document.getElementById('calc').innerHTML = f.principal>0 ?
        'Interes: <b>'+peso(c.interest)+'</b><br>Kinatibuk-ang bayran: <b>'+peso(c.total)+'</b>'+(f.freq!=='once'?'<br>Kada hulog: <b>'+peso(c.inst)+'</b> × '+c.terms+' ('+FREQ[f.freq].toLowerCase()+')':'<br>Bayran sa: <b>'+fmtDate(c.sched[0].due)+'</b>') :
        'Isulod ang kantidad aron makita ang kwenta.'; };
    lf.oninput=upd; lf.onchange=upd; upd();
    setPrev(currentPrev());
    ['phcam','phgal'].forEach(function(id){ var i=document.getElementById(id); i.onchange=function(ev){ ev.stopPropagation(); handlePhoto(i.files&&i.files[0]); i.value=''; }; });
    document.getElementById('phrm').onclick=function(){ pendingPhoto=null; setPrev(null); };
    lf.onsubmit=function(ev){ ev.preventDefault(); var f=formData(lf); if(!f.name||!(f.principal>0)){toast('Kulang ang ngalan o kantidad');return;}
      if(uploading){toast('Hulat sa picture…');return;}
      if(pendingPhoto!==undefined) f.photo=pendingPhoto; pendingPhoto=undefined;
      var ex=r.indexOf('edit-')===0?findLoan(r.slice(5)):null;
      if(ex){ Object.keys(f).forEach(function(k){ex[k]=f[k];}); save(); go('loan-'+ex.id); toast('Na-update'); }
      else { f.id=uid(); f.payments=[]; f.created=today(); STATE.loans.push(f); save(); go('agree-'+f.id); toast('Na-save — pirmahi ang kasabutan'); } };
  }
  var pf=document.getElementById('pf');
  if(pf){ pf.onsubmit=function(ev){ ev.preventDefault(); var amt=+pf.amt.value; if(!(amt>0))return;
    l.payments=l.payments||[]; l.payments.push({id:uid(),amt:amt,date:pf.date.value||today(),note:pf.note.value.trim()});
    modal=null; save(); render(); toast('Na-record ang '+peso(amt)); }; }
  bindAgree();
}
function formData(fm){ return {name:fm.name.value.trim(),phone:fm.phone.value.trim(),principal:+fm.principal.value||0,rate:+fm.rate.value||0,rateType:fm.rateType.value,
  months:Math.max(1,parseInt(fm.months.value,10)||1),freq:fm.freq.value,terms:Math.max(1,parseInt(fm.terms.value,10)||1),start:fm.start.value||today(),notes:fm.notes.value.trim()}; }

/* ---------- start ---------- */
function seed(){ try{ return JSON.parse(document.getElementById('seed').textContent); }catch(e){ return {loans:[]}; } }
function boot(raw){
  var d=null; try{ d=raw?JSON.parse(raw):null; }catch(e){}
  if(!d||!Array.isArray(d.loans)){ STATE=seed(); save(); } else STATE=d;
  render();
}
app.innerHTML='<div class="wrap"><div class="empty">Nag-load…</div></div>';
function fromLS(){ var ls=null; try{ ls=localStorage.getItem('pautang_state'); }catch(e){} boot(ls); }
kvGet('state').then(function(v){ if(v) boot(v); else fromLS(); }).catch(fromLS);
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); installEvt=e; render(); });
window.addEventListener('appinstalled',function(){ installEvt=null; render(); toast('Na-install na!'); });
})();
</script>
</body>
</html>
